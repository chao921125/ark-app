      }
    }

    var lx = {
      version: '2.0.0',
      env: 'mobile',
      envParams: {},
      EVENT_NAMES: EVENT_NAMES,
      currentScriptInfo: scriptInfo,
      on: function (event, handler) {
        return new Promise(function (resolve, reject) {
          if (!eventNames.includes(event)) return reject(new Error('The event is not supported: ' + String(event)))
          if (typeof handler !== 'function') return reject(new Error('handler must be a function'))
          if (event !== 'request') return reject(new Error('The event is not supported: ' + String(event)))
          requestHandler = handler
          lxHost.dispatch('event', runId, 'request', '')
          resolve()
        })
      },
      send: function (event, data) {
        return new Promise(function (resolve, reject) {
          if (!eventNames.includes(event)) return reject(new Error('The event is not supported: ' + String(event)))
          if (event === 'inited') {
            if (isInitedApi) return reject(new Error('Script is inited'))
            isInitedApi = true
            try {
              var payload = handleInit(data)
              lxHost.dispatch('send', runId, 'inited', JSON.stringify({ status: true, sources: payload.sources }))
              resolve()
            } catch (e) {
              lxHost.dispatch('send', runId, 'inited', JSON.stringify({ status: false, message: e.message }))
              resolve()
            }
            return
          }
          if (event === 'updateAlert') {
            if (isShowedUpdateAlert) return reject(new Error('The update alert can only be called once.'))
            isShowedUpdateAlert = true
            if (!data || typeof data !== 'object' || !data.log || typeof data.log !== 'string') {
              return reject(new Error('log is required.'))
            }
            var log = data.log.length > 1024 ? data.log.substring(0, 1024) + '...' : data.log
            lxHost.dispatch('send', runId, 'updateAlert', JSON.stringify({ log: log, updateUrl: data.updateUrl }))
            resolve()
            return
          }
          reject(new Error('Unknown event name: ' + String(event)))
        })
      },
      request: function (url, options, callback) {
        if (typeof callback !== 'function') throw new TypeError('callback required')
        var opts = options || {}
        var cancelled = false
        var body = opts.body
        if (body != undefined && typeof body !== 'string') {
          body = bufToString(body, 'utf8')
        }
        var headers = opts.headers || {}
        if (opts.form) {
          var parts = []
          for (var k in opts.form) {
            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(opts.form[k])))
          }
          body = parts.join('&')
          headers = Object.assign({}, headers, { 'Content-Type': 'application/x-www-form-urlencoded' })
        }
        if (opts.formData) throw new Error('formData is not supported in this host')
        window.__hostCall('request', {
          url: String(url),
          method: String(opts.method || 'get').toUpperCase(),
          headers: headers,
          body: body == undefined ? '' : body,
          timeout: typeof opts.timeout === 'number' && opts.timeout > 0 ? Math.min(opts.timeout, 60000) : 15000
        }).then(function (resp) {
          if (!cancelled) callback(null, { statusCode: resp.statusCode, statusMessage: '', headers: resp.headers || {} }, resp.body)
        }).catch(function (err) {
          if (!cancelled) callback(new Error(err && err.message ? err.message : 'request failed'), null, null)
        })
        return function () { cancelled = true }
      },
      utils: utils
    }
    return { lx: lx, runId: runId, getRequestHandler: function () { return requestHandler } }
  }

  // ===== 宿主调用桥（JS → ArkTS，异步结果回注）=====
  window.__hostCall = function (kind, args) {
    return new Promise(function (resolve, reject) {
      var id = 'h' + (++hostSeq)
      pendingHost[id] = { resolve: resolve, reject: reject }
      lxHost.dispatch('request', id, JSON.stringify({ kind: kind, args: args }), '')
      setTimeout(function () {
        if (pendingHost[id] != undefined) {
          delete pendingHost[id]
          reject(new Error('host call timeout'))
        }
      }, 40000)
    })
  }
  window.__hostResolve = function (callId, ok, valueJson) {
    var pending = pendingHost[callId]
    if (pending == undefined) return false
    delete pendingHost[callId]
    if (ok) {
      pending.resolve(JSON.parse(valueJson))
    } else {
      pending.reject(new Error(valueJson))
    }
    return true
  }

  // ===== 脚本生命周期入口（由 ArkTS 经 runJavaScript 调用）=====
  window.__setupLx = function (meta) {
    activeCtx = buildLx(meta || {})
    window.lx = activeCtx.lx
    globalThis.lx = activeCtx.lx
    return true
  }
  window.__resetLx = function () {
    activeCtx = null
    window.lx = undefined
    return true
  }
  window.__dispatchRequest = function (callId, paramsJson) {
    if (activeCtx == undefined || activeCtx.getRequestHandler() == undefined) {
      lxHost.dispatch('handlerResult', String(callId), '0', 'Request event is not defined')
      return false
    }
    var params = JSON.parse(paramsJson)
    if (params != undefined && params.info != undefined && params.info.musicInfo != undefined) {
      params.info.musicInfo = toScriptMusicInfo(params.info.musicInfo)
    }
    var handler = activeCtx.getRequestHandler()
    Promise.resolve()
      .then(function () { return handler(params) })
      .then(function (result) {
        // 结果校验（对齐上游 handleRequest）
        var action = params != undefined ? params.action : 'musicUrl'
        if (action === 'musicUrl' || action === 'pic') {
          if (typeof result !== 'string' || result.length > 2048 || !/^https?:/.test(result)) {
            throw new Error('failed')
          }
          lxHost.dispatch('handlerResult', String(callId), '1', JSON.stringify(result))
          return
        }
        if (action === 'lyric') {
          lxHost.dispatch('handlerResult', String(callId), '1', JSON.stringify(verifyLyricInfo(result)))
          return
        }
        lxHost.dispatch('handlerResult', String(callId), '1', JSON.stringify(result === undefined ? null : result))
      })
      .catch(function (err) {
        var msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'handler error')
        lxHost.dispatch('handlerResult', String(callId), '0', msg)
      })
    return true
  }
})()
</script>
</body>
